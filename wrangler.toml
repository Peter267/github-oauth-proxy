#:schema node_modules/wrangler/config-schema.json
# ============================================================================
# GitHub OAuth 中转代理 —— Cloudflare Workers 配置
#
# ┌─ 方式 A：网页一键部署（推荐，无需安装任何命令行工具）
# │    点 README 顶部的「Deploy to Cloudflare」按钮，Cloudflare 会自动：
# │      · 把本仓库克隆到你自己的 GitHub 账号
# │      · 自动创建下方两个 KV 命名空间并把真实 id 回填到本文件
# │      · 读取 .dev.vars.example，在部署页引导你填写 4 个 Secrets
# │      · 配置 Workers Builds（此后推送到 main 即自动重新部署）
# │    详见 DEPLOY.md
# └─
# ┌─ 方式 B：命令行部署
# │    1) npm run kv:create                            # 创建 OAUTH_KV
# │       npm run kv:create -- --binding RATE_LIMIT_KV # 可选：分布式限流
# │    2) npx wrangler secret put GITHUB_CLIENT_ID
# │       npx wrangler secret put GITHUB_CLIENT_SECRET
# │       npx wrangler secret put COOKIE_SECRET
# │       npx wrangler secret put CALLBACK_SIGNING_SECRET
# │    3) npx wrangler deploy
# └─
# ============================================================================

name = "github-oauth-proxy"
main = "src/index.ts"
# 建议跟随 Cloudflare 发布节奏更新，但升级前请先跑 npm test 回归
compatibility_date = "2025-09-23"
workers_dev = true

# 生产环境建议把 Workers 日志接出去（Workers Logs / Logpush）
[observability]
enabled = true

# ---------------------------------------------------------------------------
# KV 绑定
# ---------------------------------------------------------------------------
# 请勿手动修改下面的 id：
#   · 网页一键部署：Cloudflare 会自动创建命名空间并把真实 id 回填到本文件；
#   · 命令行部署  ：把 npm run kv:create 返回的 id 覆盖进来。
# 这里只声明 id（不声明 preview_id）——`wrangler dev` 默认走本地 KV 模拟，不需要它；
# 若你需要 `wrangler dev --remote`，再自行补上 preview_id 即可。
#
# 必要：存放一次性 state（防 CSRF）与限流计数器
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_OAUTH_KV_ID"

# 可选：滑动窗口限流计数器。不绑定则退化为「不做分布式限流」
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_RATE_LIMIT_KV_ID"

# ---------------------------------------------------------------------------
# 非敏感变量（敏感值请用 secret，禁止写进本文件；本文件会进 Git 历史）
#
# 备注：这些变量在网页部署页与 Cloudflare 控制台的
#       「Settings → Variables and Secrets」中都可以随时修改，无需重新部署。
# ---------------------------------------------------------------------------
[vars]
# Worker 对外访问地址。留空表示自动使用请求的 origin，
# 这样一键部署后无需修改即可直接用分配的 *.workers.dev 域名工作。
# 绑定了自定义域名后建议显式填写 https://gh-oauth.example.com（无末尾斜杠）。
#
# 生产环境建议显式固定该值（而不是留空）：留空时「同源」判定与 Cookie 的 Secure 标志
# 都锚定在**请求自带的 origin** 上，等于把安全边界交给外部可影响的信息；显式填写后
# callback 地址、同源判定、CORS 回显、Secure 标志全部锁定到同一个已知域名。
PUBLIC_BASE_URL = ""

# ★ 上线必须配置：允许作为 redirect_uri（业务服务器接收授权结果的地址）的白名单。
# 留空是**故意**的 fail-closed 行为 —— /authorize 会拒绝所有请求，
# 避免配置遗漏演变成开放重定向漏洞。请填成你自己的业务回调地址。
# 匹配规则见 README「白名单匹配规则」：
#   https://api.example.com            -> 该 origin 下任意路径
#   https://api.example.com/auth/gh    -> origin + 路径精确匹配（忽略 query）
#   https://api.example.com/auth/*     -> 通配符匹配
ALLOWED_CALLBACK_URIS = ""

# ★ 强烈建议配置：允许发起 /authorize 的前端 origin 白名单（校验来源合法性），逗号分隔。
# 注意：它**不是服务端强制项** —— 留空不会导致启动被拒，只会让首页出现一条告警。
# 语义与 ALLOWED_CALLBACK_URIS **相反**：留空不是 fail-closed，而是**完全不校验来源**，
# 任何站点都能拉起你的授权流程（login-CSRF 的前置条件）。token 本身不会因此泄露
# （ALLOWED_CALLBACK_URIS 仍会拦住回传地址），但请务必填上你的业务前端域名。
# 例：https://www.example.com,https://app.example.com
ALLOWED_CALLBACK_ORIGINS = ""

# 允许 success_redirect / error_redirect 指向的地址白名单，逗号分隔；留空则只允许本站
ALLOWED_REDIRECT_ORIGINS = ""

# GitHub OAuth App 里申请 scope 的默认值（可用 ?scope= 覆盖）
DEFAULT_SCOPE = "read:user user:email"

# 若设置 ALLOWED_SCOPES，则 ?scope= 只允许其子集；留空表示仅做字符与数量校验
ALLOWED_SCOPES = "read:user user:email read:org user"

# 全局默认跳转（可被 ?success_redirect= / ?error_redirect= 覆盖）；留空则渲染内置成功页
SUCCESS_REDIRECT = ""
ERROR_REDIRECT = ""

# state 有效期（秒）
STATE_TTL_SECONDS = "600"

# 每个 IP 每分钟允许的 /authorize + /callback 请求数
RATE_LIMIT_PER_MINUTE = "60"

# 调用 GitHub 的超时与重试
UPSTREAM_TIMEOUT_MS = "8000"
UPSTREAM_RETRIES = "2"

# 回传业务服务器的方式：POST（JSON + HMAC 签名，推荐）或 GET（query 参数）
DELIVERY_METHOD = "POST"
DELIVERY_TIMEOUT_MS = "8000"

# 是否允许 http:// 的跳转地址（仅本地联调时设为 true）
ALLOW_INSECURE_REDIRECTS = "false"

# 是否允许 JSON 模式（?format=json / Accept: application/json）跳过 state Cookie 绑定。
# 默认 "false"：JSON 模式**同样**要求完成 Cookie 绑定 —— 前端调用 /authorize 时须带
# credentials: 'include'，且该前端 origin 必须在 ALLOWED_CALLBACK_ORIGINS 白名单内。
# 设为 "true" 会恢复到旧行为（JSON 模式只依赖 KV 的一次性 state），代价是削弱 CSRF 防护
# （login-CSRF 的前置条件被放开），仅在确实无法使用 Cookie 的集成场景下临时启用。
ALLOW_UNBOUND_STATE = "false"

ENVIRONMENT = "production"
VERSION = "1.0.0"
LOG_LEVEL = "info"

# ---------------------------------------------------------------------------
# 自定义域名（可选）
# ---------------------------------------------------------------------------
# [[routes]]
# pattern = "gh-oauth.example.com"
# custom_domain = true
