<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>业务前端：GitHub 登录按钮示例</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f6f7f9; color:#1f2328;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .card { width:min(560px,92vw); background:#fff; border:1px solid #d8dee4; border-radius:12px;
          padding:30px 32px; box-shadow:0 8px 28px rgba(27,31,36,.08); }
  h1 { font-size:19px; margin:0 0 8px; }
  p { color:#57606a; font-size:14px; line-height:1.65; margin:0 0 16px; }
  button { display:inline-flex; align-items:center; gap:9px; border:1px solid #1f2328; border-radius:8px;
           background:#24292f; color:#fff; font-size:14.5px; font-weight:600; padding:11px 18px; cursor:pointer; }
  button:hover { background:#32383f; }
  button:disabled { opacity:.6; cursor:progress; }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px;
         background:#f6f8fa; border:1px solid #d8dee4; border-radius:6px; padding:2px 6px; }
  pre { background:#f6f8fa; border:1px solid #d8dee4; border-radius:8px; padding:12px;
        font-size:12.5px; overflow:auto; margin:0; }
  .muted { color:#8b949e; font-size:12px; margin-top:14px; }
</style>
</head>
<body>
<main class="card">
  <h1>GitHub 登录</h1>
  <p>本页演示业务前端如何把用户交给 OAuth 中转 Worker。
     <code>redirect_uri</code> 必须已经配置在 Worker 的 <code>ALLOWED_CALLBACK_URIS</code> 中，
     本页所在域名也必须配置在 <code>ALLOWED_CALLBACK_ORIGINS</code> 中。</p>

  <button id="login">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
               0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
               -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
               .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
               -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0
               1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82
               1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01
               1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
    </svg>
    <span id="label">使用 GitHub 登录</span>
  </button>

  <div class="muted">点击后跳转到中转 Worker，再由它跳转到 GitHub 授权页。</div>

  <h1 style="font-size:15px;margin-top:26px">等价的最小代码</h1>
  <pre id="snippet"></pre>
</main>

<script>
  // ===== 按你的实际部署替换这三项 =====
  const PROXY_BASE_URL = 'https://gh-oauth.example.workers.dev';
  const BUSINESS_CALLBACK_URI = 'https://api.example.com/auth/github/callback';
  const SUCCESS_REDIRECT = 'https://www.example.com/login/success';

  function randomState() {
    const bytes = new Uint8Array(32);
    crypto.getRandomValues(bytes);
    return btoa(String.fromCharCode(...bytes))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function buildLoginUrl() {
    // 业务自己的 state：随机生成、存 sessionStorage，回调后由业务服务器比对
    const state = randomState();
    sessionStorage.setItem('oauth_state', state);

    const url = new URL('/authorize', PROXY_BASE_URL);
    url.searchParams.set('redirect_uri', BUSINESS_CALLBACK_URI);
    url.searchParams.set('state', state);
    url.searchParams.set('scope', 'read:user user:email');
    url.searchParams.set('success_redirect', SUCCESS_REDIRECT);
    return url.toString();
  }

  document.getElementById('snippet').textContent =
`const state = randomState();                       // 32 字节随机串
sessionStorage.setItem('oauth_state', state);      // 回调后比对
location.href = '${PROXY_BASE_URL}/authorize'
  + '?redirect_uri=' + encodeURIComponent('${BUSINESS_CALLBACK_URI}')
  + '&state=' + encodeURIComponent(state)
  + '&scope=' + encodeURIComponent('read:user user:email');`;

  document.getElementById('login').addEventListener('click', () => {
    const button = document.getElementById('login');
    button.disabled = true;
    document.getElementById('label').textContent = '正在跳转…';
    location.href = buildLoginUrl();
  });
</script>
</body>
</html>
